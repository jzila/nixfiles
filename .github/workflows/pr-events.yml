# Tell Hermes on argo about reviews and comments on a PR. Joins the tailnet as
# tag:github-ci (workload identity federation: no Tailscale secret stored here;
# the tailnet policy lets the tag reach only argo:8646) and posts just the repo
# and PR number. Hermes reads the PR from GitHub itself, so the post is only a
# hint. Per PR, at most one run posts at a time and one more waits: a burst (a
# review with several comments) is the first post plus one catch-up, and the
# script reports only what's new, so nothing is lost and nothing repeats.
name: pr-events

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]

permissions:
  id-token: write

concurrency:
  group: pr-events-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  notify:
    if: (github.event.pull_request || github.event.issue.pull_request) && github.actor != 'zila-hermes[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-ci
      - name: Post to Hermes
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          jq -nc --arg repo "$REPO" --argjson pr "$PR" '{repo: $repo, pr: $pr}' |
            curl -fsS --retry 3 --retry-all-errors --max-time 20 \
              -H 'Content-Type: application/json' --data-binary @- \
              http://100.114.52.57:8646/webhooks/github-pr
