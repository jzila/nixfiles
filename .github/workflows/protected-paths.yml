# Fails on any PR that touches the files defining Hermes's own permissions or
# what deploys to argo as root: Hermes's container, webhook scripts and skills,
# the Home Assistant runners, the deploy of main to argo (nixos-deploy.nix and
# its scripts), argo's host config (its module list), the flake and its lock
# (an input bump pulls arbitrary upstream code), and .github/ itself. The
# `protected` regex below is the one list; AGENTS.md points here. The check is
# required on main, so such a PR lands only by an admin merging it past the
# rules, a deliberate step on top of the code owner review; Hermes can't merge
# it and can't change this workflow (the zila-hermes app has no workflow
# permission). It runs on every PR, with no paths filter, because a required
# check that never reports blocks the merge.
name: protected-paths

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  protected-paths:
    name: Protected paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          protected='^(\.github/|flake\.(nix|lock)$|hosts/argo/|modules/hermes-container\.nix$|modules/hermes-scripts/|modules/hermes-skills/|modules/ha-gitops\.nix$|modules/nixos-deploy(\.nix$|/))'
          # --no-renames lists both sides of a rename.
          hits=$(git diff --name-only --no-renames "$BASE...$HEAD" | grep -E "$protected" || true)
          if [ -n "$hits" ]; then
            echo "::error::This PR changes files that define Hermes's own permissions or what deploys to argo; only an admin can merge it (bypassing the rules):"
            echo "$hits"
            exit 1
          fi
          echo "No protected paths changed."
