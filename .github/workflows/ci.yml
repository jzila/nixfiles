name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-flake:
    name: Check Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Check flake
        run: nix flake check --accept-flake-config

  build-nixos:
    name: Build NixOS (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - venator
          - argo
          - hermes
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Build NixOS configuration
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run

  build-darwin:
    name: Build nix-darwin (macbook)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Build nix-darwin configuration
        run: nix build .#darwinConfigurations.macbook.system --dry-run

  # The hermes VM follows this branch (nixos-upgrade, hosts/hermes/configuration.nix).
  deploy-hermes:
    name: Deploy (hermes)
    needs: [check-flake, build-nixos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: hermes
    permissions:
      contents: write
    concurrency: deploy-hermes
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Not forced: only a fast-forward moves it.
      - run: git push origin HEAD:refs/heads/deploy
