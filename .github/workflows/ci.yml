name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-flake:
    name: Check Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Check flake
        run: nix flake check --accept-flake-config

  build-nixos:
    name: Build NixOS (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - venator
          - argo
          # Hermes's VM; its deploy also requires this check on main.
          - hermes
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Build NixOS configuration
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run

  build-darwin:
    name: Build nix-darwin (macbook)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Build nix-darwin configuration
        run: nix build .#darwinConfigurations.macbook.system --dry-run

  # Hermes's VM deploys main to itself (hosts/hermes/deploy.nix): this job runs
  # on the VM's own runner and asks it to, then shows that deploy's log.
  deploy-hermes:
    name: Deploy (hermes)
    needs: [check-flake, build-nixos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, nixfiles]
    environment: hermes
    concurrency:
      group: deploy-hermes
      cancel-in-progress: false
    # The VM's build has 4 hours, then the health check 5 minutes.
    timeout-minutes: 300
    steps:
      - name: Deploy main to the hermes VM
        run: nixos-deploy-request
