# Tell Hermes when one of its PRs conflicts with main. GitHub runs no
# pull_request* workflow on a conflicting PR (they need its merge commit), so
# pr-events.yml goes quiet there; push and pull_request_target don't need one.
# On a push to main, every open PR of the bot's is checked; when one of its
# PRs is opened or pushed to, just that one. Mergeability is computed lazily,
# so an UNKNOWN is retried for up to a minute, then dropped. Nothing from the
# PR is checked out or run: only the GitHub API is read and, for each
# conflicting PR, {repo, pr, conflict: true} is posted the way pr-events.yml
# posts (see there); Hermes reads the PR itself and asks once per head commit.
name: pr-conflicts

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: pr-conflicts-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'push' || github.event.pull_request.user.login == 'zila-hermes[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find conflicting PRs
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          prs=${PR:-$(gh pr list -R "$REPO" --author app/zila-hermes --state open --json number --jq '.[].number')}
          end=$((SECONDS + 60))
          conflicting=
          for pr in $prs; do
            while m=$(gh pr view "$pr" -R "$REPO" --json mergeable --jq .mergeable) &&
                [ "$m" = UNKNOWN ] && [ "$SECONDS" -lt "$end" ]; do
              sleep 5
            done
            echo "#$pr: $m"
            if [ "$m" = CONFLICTING ]; then conflicting="$conflicting $pr"; fi
          done
          echo "prs=$conflicting" >> "$GITHUB_OUTPUT"
      - if: steps.find.outputs.prs != ''
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-ci
      - name: Post to Hermes
        if: steps.find.outputs.prs != ''
        env:
          REPO: ${{ github.repository }}
          PRS: ${{ steps.find.outputs.prs }}
        run: |
          for pr in $PRS; do
            jq -nc --arg repo "$REPO" --argjson pr "$pr" '{repo: $repo, pr: $pr, conflict: true}' |
              curl -fsS --retry 3 --retry-all-errors --max-time 60 \
                -H 'Content-Type: application/json' --data-binary @- \
                http://100.114.179.48:8646/webhooks/github-pr
          done
